import app.robot.sindarin_dictionary_en.AppModules
import app.robot.sindarin_dictionary_en.Plugins
import app.robot.sindarin_dictionary_en.Versions

buildscript {
    ext {
        composeCompilerVersion = "${Versions.kotlin}"
        composeCompiler = "${Plugins.composeCompiler}"
    }
}

apply plugin: Plugins.library
apply plugin: Plugins.kotlinAndroid

apply from: "$rootDir/config/dependencies-groups.gradle"
apply from: "$rootDir/config/config-android.gradle"
apply from: "$rootDir/config/config-product-flavors.gradle"

android {
    namespace 'apps.robot.grammar.impl'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        def useFirebasePronounceDataSource = providers.gradleProperty("useFirebasePronounceDataSource").getOrElse("false")
        if (!(useFirebasePronounceDataSource in ["true", "false"])) {
            throw new GradleException("useFirebasePronounceDataSource must be true or false")
        }
        buildConfigField "boolean", "USE_FIREBASE_PRONOUNCE_DATA_SOURCE", useFirebasePronounceDataSource
    }
}

dependencies {
    implementation project(AppModules.baseUi)
    implementation project(AppModules.Dictionary.api)
    implementation project(AppModules.Grammar.api)
    kotlinLib()
    koin()
    firebase()
    composeCore()
    navigationCompose()
    support()
    networkCore()
    database()
    timber()
    lazyColumnScrollbar()
}
